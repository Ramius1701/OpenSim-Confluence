; These are the initialization settings for running Robust with an SQLite
; database. Each service below gets its own file so no single database
; is hit by every service's traffic - swap any of these to a shared
; ConnectionString (e.g. all pointing at Robust.db) if you'd rather keep
; everything in one file.

[DatabaseService]
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ConnectionString = "URI=file:Robust.db;UseUTF16Encoding=True"

[AssetService]
    ConnectionString = "URI=file:Asset.db"

[InventoryService]
    ConnectionString = "URI=file:Inventory.db;UseUTF16Encoding=True"

[GridService]
    ConnectionString = "URI=file:GridStore.db"

[AuthenticationService]
    ConnectionString = "URI=file:Auth.db"

[AvatarService]
    ConnectionString = "URI=file:Avatars.db"

[PresenceService]
    ConnectionString = "URI=file:Presence.db"

[UserAccountService]
    ConnectionString = "URI=file:UserAccounts.db"

[GridUserService]
    ConnectionString = "URI=file:GridUser.db"

[AgentPreferencesService]
    ConnectionString = "URI=file:AgentPrefs.db"

[FriendsService]
    ConnectionString = "URI=file:Friends.db"

[MuteListService]
    ConnectionString = "URI=file:MuteList.db"

[AbuseReportsService]
    StorageProvider = "OpenSim.Data.SQLite.dll:SQLiteAbuseReportsData"
    ConnectionString = "URI=file:AbuseReports.db"

[ExperienceService]
    ConnectionString = "URI=file:Experience.db"
