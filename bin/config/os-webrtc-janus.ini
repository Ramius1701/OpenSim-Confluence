; os-webrtc-janus, pointed at ConfluenceVoice instead of a Janus gateway.
;
; bin/config/ loads AFTER OpenSim.ini and overrides it (see ConfigurationLoader.cs),
; so this survives regenerating OpenSim.ini and applies to every region this one
; OpenSim process runs (Enabled is read once per process).
;
; ConfluenceVoice: S:\Github\ConfluenceVoice — a Windows-native fork of wolfvoice
; (see PROJECT_LOG.md, 2026-09-13, "ConfluenceVoice wired in"). The addon itself
; (this directory) is unmodified; only the target it POSTs JSON-RPC to changes.

[WebRtcVoice]
    Enabled = true

    ; WebRtcVoiceServiceConnector is a plain JSON-RPC client that posts to any URL —
    ; that's what lets it target ConfluenceVoice instead of WebRtcJanusService (which
    ; would need a running Janus gateway).
    SpatialVoiceService = WebRtcVoice.dll:WebRtcVoiceServiceConnector
    NonSpatialVoiceService = WebRtcVoice.dll:WebRtcVoiceServiceConnector

    ; ConfluenceVoice's RPC endpoint (confluencevoice.toml's rpc_bind, default port
    ; 9443). MUST be a certificate .NET's HttpClient will trust via the normal chain
    ; — a self-signed dev cert will fail validation here even if ConfluenceVoice
    ; itself accepts the TLS handshake. Fine for local loopback wiring checks that
    ; don't go through this connector; a real viewer test needs either a real
    ; CA-issued cert (Let's Encrypt) or this machine's trust store extended for the
    ; dev cert — the latter is a system-trust change, so do that yourself rather
    ; than having anything automate it.
    WebRtcVoiceServerURI = https://192.168.88.14:9443

    ; Logs entire SDP bodies. Handy while diagnosing, noisy otherwise.
    MessageDetails = false

    ; STUN servers to advertise to the viewer via SimulatorFeatures. Firestorm
    ; hardcodes its own (stunN.<grid>.secondlife.io, which won't resolve off Second
    ; Life) but ConfluenceVoice's own host candidate covers same-network viewers
    ; regardless. Left unset for now — revisit if NAT'd viewers report no audio.
    ; StunServers = stun2.l.google.com:19302,stun.l.google.com:19302

[VivoxVoice]
    ; Both modules register the SAME capability name; last registration wins, so
    ; leaving Vivox enabled alongside WebRTC is a race rather than a real choice.
    enabled = false
