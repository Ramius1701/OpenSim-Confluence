[Feature]
Title = "Weather module"
Summary = "Regions can run rain, storm, snow or sunny presets with wind, clouds, lightning, thunder and automatic forecast cycling."
Overview = "The weather system adds estate-controlled atmosphere without needing scripted emitters scattered by hand. It can change clouds and wind, spawn particle weather, announce forecasts and cycle between presets after startup."
Usage1 = "Weather is enabled by default for the showcase profiles; estate managers use /89 weather rain, /89 weather storm, /89 weather snow, /89 weather sunny, /89 weather clear and /89 weather status."
Usage2 = "Configure AutoCycleEnabled, AutoCycleHours and AutoCycleChoices to let the region rotate between storm, rain, snow, sunny and clear."
Usage3 = "Tune EmitterGrid, Intensity, wind strengths and lightning delays per region style."
Usage4 = "Use forecast warning and entry IM messages when visitors should know current and upcoming conditions."
Note1 = "Large storms create many emitters, so keep intensity and emitter spacing reasonable on busy regions."
