[Feature]
Title = "Viewer polish"
Summary = "Simulator version branding reduces noisy viewer warnings and keeps neighbouring regions feeling consistent."
Overview = "Viewer-facing polish keeps neighbouring regions feeling like one estate. The simulator can send a stable branded version string to viewers so teleports and crossings do not produce noisy different-version warnings when local builds or operating systems differ."
Usage1 = "Set SendSimulatorVersionToViewer and ViewerSimulatorVersionOverride in [ClientStack.LindenUDP]."
Usage2 = "Use the same override string across estate regions that should feel like one coherent grid experience."
Note1 = "This is presentation polish only; keep the actual simulator binaries compatible for crossings and shared services."
