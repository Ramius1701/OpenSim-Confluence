[Feature]
Title = "Lag-resistant walk animations"
Summary = "Walking animations recover cleanly after lag spikes, so avatars do not remain stuck in broken walk states when the simulator catches up."
Overview = "When the simulator lags, avatars can sometimes remain visually stuck in a bad walking state even after movement resumes. This build recovers walk animation state when the simulator catches up, so visitors do not stay trapped in broken locomotion."
Usage1 = "No viewer-side action is required; the server handles recovery automatically."
Usage2 = "If a region is under heavy load, wait a few seconds after the spike before judging animation state."
Usage3 = "Keep custom AO scripts reasonable, because very aggressive scripted animation overrides can still fight normal movement animation."
Note1 = "This does not hide real simulator load; it prevents lag from leaving avatars visually broken after the load spike passes."
