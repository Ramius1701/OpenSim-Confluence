[Feature]
Title = "AI-connected text build tools"
Summary = "Estate builders can use text commands connected to AI or uploaded cartography textures to plan, generate and refine terrain or building ideas directly from the simulator workflow."
Overview = "The text build tool connects in-world commands to AI-assisted building workflows. Builders can describe what they want, iterate on ideas and use text as a faster control surface for terrain, layout or object planning inside the simulator workflow."
Usage1 = "Enable the text build module and use its configured in-world command channel."
Usage2 = "Speak concise build requests on that channel, then refine the result with follow-up instructions."
Usage3 = "To generate real-world shaped terrain, upload a cartography or satellite texture and say a command such as build terrain from texture <uuid> or costruisci Sardegna da texture <uuid>."
Usage4 = "Use it for planning, layout, terrain and fast creative iteration, then review the generated changes like any other build work."
Note1 = "AI-assisted building should stay permission-aware: restrict access to trusted builders or estate staff."
Note2 = "Cartography terrain treats cyan/celeste map areas as sea, fits the detected land/water silhouette while preserving source aspect ratio, keeps the coastline mask sharp while smoothing inland terrain, ignores child-region chat events and sets water height to 21m."
