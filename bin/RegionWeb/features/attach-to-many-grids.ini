[Feature]
Title = "Attach to many grids"
Summary = "Attach your region to many grids at the same time, like OSGrid, Neverworld, Craft or any public grid you choose, with one click."
Overview = "This estate lets one region appear on more than one grid map at the same time. You can keep your home base here, then share the same place with OSGrid or another friendly public grid from the multigrid switch profile. Visitors can discover the region from the grids they already use, while your simulator still keeps one home for inventory, assets and accounts."
Usage1 = "Enable [MultiGridAttachments] and list attachment names in Grids, for example Grids = \"osgrid,neverworld,zetasim,craft\"."
Usage2 = "Create one [MultiGridAttachment.<name>] section per target with GridServerURI pointing at the target grid service root, such as http://grid.example.com:8002."
Usage3 = "For OSGrid, use GridServerURI = http://grid.osgrid.org and GridPostURI = http://grid.osgrid.org/grid; http://hg.osgrid.org:80 is the Hypergrid login/gatekeeper endpoint, not the region registration endpoint."
Usage4 = "Set GridPostURI when the target's registration endpoint is not simply GridServerURI plus /grid; Neverworld uses http://hg.neverworldgrid.com:8003/grid for region registration, while 8002 is its public login/gatekeeper endpoint."
Usage5 = "For ZetaWorlds, use GridServerURI = http://robust.zetaworlds.com:8003 and GridPostURI = http://robust.zetaworlds.com:8003/grid; http://hg.zetaworlds.com:80 is the Hypergrid login/gatekeeper endpoint."
Usage6 = "For Craft World, use GridServerURI = http://craft-world.org:8003 and GridPostURI = http://craft-world.org:8003/grid with BasicHttpAuthentication; http://craft-world.org:8002 is the Hypergrid login/gatekeeper endpoint."
Usage7 = "Set ExternalHostName and ServerURI to your public DNS endpoint, for example vanilla-sim.com and http://vanilla-sim.com:9000."
Usage8 = "Leave Regions empty to publish every local region, or list region names/UUIDs to publish only selected regions."
Usage9 = "Use Location = x,y when the secondary grid needs a different map coordinate for the published region."
Usage10 = "Use RegionNamePrefix, RegionNameSuffix or RegionName when the target grid needs unique names."
Usage11 = "Set AuthType = BasicHttpAuthentication plus HttpAuthUsername/HttpAuthPassword when a private friend's grid protects its grid service."
Usage12 = "Keep AutoCreateInboundPresence = true so teleports from an attached grid map can create the local presence row before Scene.VerifyUserPresence runs."
Usage13 = "Keep Strict = false, ContinueOnFailure = true and a short TimeoutSeconds value for public grids so rejected or slow attachments run in the background and do not stop the simulator."
Note1 = "This is a publication/attachment layer. The simulator still has one primary grid for inventory, assets, accounts and presence."
Note2 = "Public grids may reject registration unless they explicitly allow your region server or provide credentials."
Note3 = "Use a DNS name rather than a raw IP address for Hypergrid-facing endpoints; some grids refuse raw-IP HG addresses."
