[Feature]
Title = "High quality world map"
Summary = "Terrain textures, water depth shading, land detail, aerial tone mapping, mesh/sculpt geometry projection, cleaner water alpha handling, background generation and cooperative rendering make map tiles sharper, more geographic and safer for simulator responsiveness."
Overview = "The world map renderer produces a sharper source tile before the viewer ever zooms it. It combines terrain texture sampling, depth-aware water color, aerial tone mapping, mesh and sculpt projection, cleaner alpha handling for water overlays, and cooperative render passes that avoid starving the simulator while heavy object scenes are being drawn."
Usage1 = "Keep GenerateMaptiles enabled in [Map] and use MapImageModule for the region map renderer."
Usage2 = "Enable texture sampling and mesh/sculpt aware rendering when you want detailed marinas, vehicles, sculpt builds and textured terrain to appear correctly on the map."
Usage3 = "Use the console command generate map after changing terrain, water objects, large builds or map settings."
Usage4 = "If wave planes or animated water overlays pollute the tile, lower MapWaterObjectVolumeOpacity or keep texture alpha sampling enabled."
Note1 = "Very large opaque builds are still rendered, while transparent water-like overlays are drawn faintly so they do not become grey rectangles."
Note2 = "Background and cooperative rendering make the feature safer on busy regions, but a manual map render can still be expensive on very dense scenes."
