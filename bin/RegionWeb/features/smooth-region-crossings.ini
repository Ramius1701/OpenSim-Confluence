[Feature]
Title = "Smooth region crossings"
Summary = "Avatar and vehicle crossings between neighbouring regions are smoothed to reduce the hard stop, rubber-banding and visual pop of stock OpenSim border transfers."
Overview = "Region crossings are softened so avatars and vehicles do not hit the border with the abrupt stop, rubber-banding and visual pop that stock OpenSim can show during transfer. The goal is to make neighbouring regions feel like one larger continuous place."
Usage1 = "Keep neighbouring regions online, adjacent and reachable through the normal simulator neighbour connection."
Usage2 = "Use consistent simulator builds and compatible physics settings on regions that share a border."
Usage3 = "Test crossings with both walking avatars and vehicles after changing region size, physics or network settings."
Note1 = "Crossing quality still depends on network latency and the target region being healthy, but the server now reduces the harsh visual transition."
