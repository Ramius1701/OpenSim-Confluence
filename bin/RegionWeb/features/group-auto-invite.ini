[Feature]
Title = "Group auto invite"
Summary = "Visitors can receive normal viewer group invitations on arrival without needing scripted invite objects."
Overview = "Regions can invite arriving root avatars to a configured group using the normal viewer group invitation popup. This replaces fragile scripted invite objects with a server-side region module."
Usage1 = "Enable [GroupAutoInvite] and set GroupID or GroupName."
Usage2 = "Optionally set InviterID, RoleID, InviteDelaySeconds and a custom InviteMessage."
Usage3 = "Keep InviteOncePerSession enabled if visitors should not be spammed after teleports or relogs."
Note1 = "The module sends an invitation; it does not force users to join."
