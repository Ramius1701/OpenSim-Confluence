[Feature]
Title = "Viewer-visible local currency"
Summary = "If the separate RegionCurrency addon-module is installed, the estate can run a local persistent currency ledger that sends live balances to the viewer and handles transfers and token purchases."
Overview = "RegionCurrency is a separate addon-module (not part of RegionWeb itself) providing an avatar wallet, PayPal token purchases, and an admin dashboard for managing balances, backed by whatever IMoneyModule the region is running."
Usage1 = "Enable the economy module with economymodule = BetaGridLikeMoneyModule in [Economy]."
Usage2 = "Set InitialBalance to the amount a new avatar should receive the first time they appear in the ledger."
Usage3 = "Set BalanceStorage to choose where the persistent TSV balance ledger is stored; relative paths live under the OpenSim bin folder."
Usage4 = "Set TransactionLog and AuditEnabled to control the TSV transaction audit trail."
Usage5 = "Keep AllowNegativeBalances = false for normal viewer currency behavior unless you deliberately want overdraft-style testing."
Usage6 = "Set the LoginService Currency value to the viewer-facing currency name you want users to see beside their balance."
Usage7 = "Use console commands such as money show, money balance, money set, money give, money take, money transfer, money export and money import for estate administration."
Usage8 = "If the separate RegionCurrency addon-module is installed, see its own documentation for the avatar wallet area (balance, statement, buy, transfer)."
Usage9 = "With RegionCurrency installed, estate owners can open its /admin path, request an inworld admin token and manage pending token requests plus avatar balances."
Usage10 = "Use CurrencyBuyEnabled, CurrencyTransferEnabled, CurrencyChallengeCooldownSeconds, CurrencyStatementLimit and CurrencyBuyLimit in RegionCurrency's own [RegionCurrency] config section to tune the wallet."
Usage11 = "Set CurrencyBuyMode = request if purchases should become pending wallet requests instead of immediate credits."
Usage12 = "Set CurrencyBuyMode = paypal plus PayPalEnabled, PayPalClientID, PayPalClientSecret, PayPalCurrencyCode, PayPalPricePerToken and PayPalReturnBaseUrl to route wallet token purchases through PayPal Checkout before crediting the local ledger."
Usage13 = "From RegionCurrency's /admin path, use requests.csv and balances.csv to export pending purchase requests and avatar balances for external audit."
Usage14 = "Use regioncurrency pending, regioncurrency approve <request-id> and regioncurrency deny <request-id> to manage pending wallet purchase requests from the simulator console."
Usage15 = "Restart the region after changing economy settings, then log in or request the balance in the viewer to receive the latest MoneyBalanceReply."
Note1 = "Balances are local to this simulator/grid configuration and are intended for estate/gameplay currency, not real-money production payment processing."
Note2 = "Scripted llGiveMoney and llTransferLindenDollars still require owner-granted PERMISSION_DEBIT before money leaves the object owner."
Note3 = "Object payments trigger the normal money event path, so in-world vendors and donation jars can react when the viewer pays an object."
Note4 = "Land/object purchases and upload/group charges use the same ledger, so users see the result immediately in the viewer balance."
Note5 = "This estate region pages show live economy totals when this local money module is active, and the wallet login uses a one-time inworld token instead of trusting only a typed avatar name."
Note6 = "Wallet buy, transfer and logout forms are protected by a session CSRF token, and the statement can be downloaded as CSV."
Note7 = "Pending wallet purchase requests are stored in CurrencyPurchaseStorage as TSV so they survive simulator restarts."
Note8 = "PayPal checkout orders are stored in PayPalOrderStorage as TSV; tokens are credited only after the PayPal order capture returns completed."
