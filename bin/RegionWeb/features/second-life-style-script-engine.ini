[Feature]
Title = "Second Life-style script engine"
Summary = "The script engine is moving closer to Second Life behavior with Experience-Lite permissions, scripted sit controls, key-value stores, linkset data, environment, estate-return, parcel media, parcel prim counts/details, guarded money transfer, inventory transfer, damage, RSA, attachment filter, identity lookup, privacy-aware agent language lookup, animation-state introspection, physics energy readback, object-detail cost readback, script memory/profiler diagnostics, GLTF material and physics primitive-param helpers, plus a This estate compatibility center and in-world regression lab."
Overview = "The script engine now includes a wider Second Life-style scripting surface for modern estate systems. Trusted estate scripts can use Experience-Lite permissions, persistent experience key-value storage, linkset data with linkset_data events, scripted sit controls, linked sound controls, region and parcel environment helpers, estate return and terrain helpers, parcel media controls, same-owner simulator-wide parcel prim counts/details, guarded debit-permission money transfer, direct inventory and ownership transfer, direct damage helpers with Combat2-style pre-application damage transactions, cached identity lookup, privacy-aware agent language lookup, animation-state introspection, physics energy readback, object-detail cost/render/selection readback, script memory limit/profiler diagnostics, GLTF/render material primitive params with stored override readback, physics material primitive params, secure hashing/HMAC/RSA helpers, parameterized rez/derez workflows, filtered attachment inspection and HUD coordinate helpers without relying on brittle scripted workarounds. Second Life pathfinding character calls now provide persistent character option state, baked terrain navmesh caching, terrain-aware A* routing, parcel-stay handling and dynamic object/avatar obstacle avoidance where OpenSim does not expose the proprietary SL navmesh service. This estate exposes a script compatibility center, and the example suite includes an in-world regression controller for post-build checks."
Usage1 = "Enable [ScriptExperiences] only in trusted estate environments."
Usage2 = "Add trusted script owner UUIDs to TrustedOwners, or specific root object/prim UUIDs to TrustedObjects."
Usage3 = "Keep AutoGrantPermissions limited to the permissions your estate systems actually need."
Usage4 = "Use llRequestPermissions normally from scripts; trusted requests are granted automatically when covered by the configured bitmask."
Usage5 = "Use llIsExperienceTrusted(), llAgentInExperience(agent), llGetExperienceDetails(NULL_KEY), llGetExperiencePermissions() and llExperienceCanAutoGrant(mask) when scripts need to adapt to trusted or untrusted regions."
Usage6 = "Use llRequestExperiencePermissions(agent, name) with experience_permissions(agent) and experience_permissions_denied(agent, reason) for SL-style Experience-Lite scripts."
Usage7 = "Use llSitOnLink(agent, link) after experience_permissions(agent) to seat visitors on a specific linked sit target; it returns SL-style SIT_* result codes."
Usage8 = "Use llSetLinkSitFlags(link, flags), llGetLinkSitFlags(link), PRIM_SCRIPTED_SIT_ONLY and PRIM_ALLOW_UNSIT to create seats that cannot be taken by a normal viewer sit click but can be controlled by trusted scripts."
Usage9 = "Use llCreateKeyValue(key, value), llReadKeyValue(key), llUpdateKeyValue(key, value, checked, originalValue), llDeleteKeyValue(key), llDataSizeKeyValue(), llKeyCountKeyValue() and llKeysKeyValue(first, count)."
Usage10 = "Use llGetExperienceKeyValueStoreStats() to inspect enabled/trusted state, key counts, byte usage and configured KVP limits."
Usage11 = "Handle dataserver(queryid, data). Replies use 1,value for success and 0,errorCode for failure."
Usage12 = "Use llGetExperienceErrorMessage(errorCode) to turn failure codes into readable script diagnostics."
Usage13 = "Use llLinksetDataWrite(), llLinksetDataRead(), llLinksetDataDelete(), protected variants, pattern search/list helpers and linkset_data(action, name, value) for object-local persistent state."
Usage14 = "Use llRezObjectWithParams() with REZ_* and REZ_FLAG_* constants for SL-style parameterized rezzing, and llDerezObject() for scripted cleanup."
Usage15 = "Use llLinkPlaySound(), llLinkStopSound(), llLinkAdjustSoundVolume(), llLinkSetSoundRadius() and llLinkSetSoundQueueing() with SOUND_* flags for linked sound control."
Usage16 = "Use llGetDayLength(), llGetRegionDayLength(), llGetDayOffset(), llGetRegionDayOffset(), llGetSunDirection(), llGetRegionSunDirection(), llGetMoonDirection(), llGetRegionMoonDirection(), llGetSunRotation(), llGetRegionSunRotation(), llGetMoonRotation() and llGetRegionMoonRotation() for environment-aware scripts."
Usage17 = "Use llGetEnvironment(), llReplaceEnvironment(), llReplaceAgentEnvironment(), llSetEnvironment() and llSetAgentEnvironment() for supported EEP day-cycle, parcel, region, agent, sky-parameter and water-parameter workflows."
Usage18 = "Use llReturnObjectsByID(), llReturnObjectsByOwner(), OBJECT_RETURN_* and PERMISSION_RETURN_OBJECTS for scripted estate/parcel cleanup."
Usage19 = "Use llSetParcelForSale(forSale, options), PARCEL_SALE_* and PERMISSION_PRIVILEGED_LAND_ACCESS for scripted parcel sale workflows when the script owner owns the parcel."
Usage20 = "Use llParcelMediaCommandList(), llParcelMediaQuery(), PARCEL_MEDIA_COMMAND_LOOP_SET, media description/type/size and auto-align fields for SL-style parcel media controllers."
Usage21 = "Use llGetParcelPrimCount(pos, PARCEL_COUNT_*, sim_wide) for local parcel and same-owner simulator-wide prim counters, including PARCEL_COUNT_TEMP."
Usage22 = "Use llGetParcelDetails(pos, [PARCEL_DETAILS_PRIM_CAPACITY, PARCEL_DETAILS_PRIM_USED]) for SL-style same-owner simulator-wide parcel capacity and usage."
Usage23 = "Use llGiveMoney() or llTransferLindenDollars() only after owner-granted PERMISSION_DEBIT; group-owned objects and non-avatar targets are rejected."
Usage24 = "Use llSetGroundTexture() with TERRAIN_DETAIL_* and TERRAIN_HEIGHT_RANGE_* to update estate terrain textures and blending heights."
Usage25 = "Use llSetRenderMaterial(), llSetLinkRenderMaterial(), llSetLinkGLTFOverrides(), llGetRenderMaterial(), llIsLinkGLTFMaterial(), PRIM_RENDER_MATERIAL, PRIM_GLTF_* and OVERRIDE_GLTF_* constants for PBR/material-aware content, including primitive-param render-material set/get, assigned GLTF material asset readback, stored GLTF override readback and OVERRIDE_GLTF_EXTENSION_JSON staging for future extension JSON."
Usage26 = "Use PRIM_PHYSICS_MATERIAL through llSetPrimitiveParams(), llGetPrimitiveParams(), llSetLinkPrimitiveParams() and llGetLinkPrimitiveParams() for SL-order gravity, restitution, friction and density workflows."
Usage27 = "Use llMatchGroup(agent, group_keys) for same-region active-group checks without scripted llSameGroup relay objects."
Usage28 = "Use llSetDamage(), llDamage(), llGetHealth(), PRIM_DAMAGE, PRIM_HEALTH, OBJECT_HEALTH, OBJECT_DAMAGE, OBJECT_DAMAGE_TYPE and DAMAGE_TYPE_* constants for supported health/damage workflows; on_damage scripts can call llAdjustDamage() before the transaction applies health."
Usage29 = "Pathfinding scripts can compile against llCreateCharacter(), llNavigateTo(), llGetStaticPath() and related CHARACTER_* APIs; OpenSim now persists character options, routes over a baked terrain navmesh cache with A*, avoids scene-object and optional avatar bounds, honors parcel-stay settings and posts path_update when movement completes where the proprietary SL navmesh service is unavailable."
Usage30 = "Use llHMAC(), llComputeHash(), llSignRSA() and llVerifyRSA() for signature checks, web callbacks and secure scripted handshakes."
Usage31 = "Use llGetAttachedListFiltered(), ATTACH_ANY_HUD, FILTER_INCLUDE and FILTER_FLAG_HUDS for filtered attachment queries."
Usage32 = "Use llDetectedRezzer() from sensor/collision/touch-style detected data when scripts need to identify object provenance."
Usage33 = "Use llKey2Name(), llGetUsername(), llGetDisplayName(), llName2Key(), llRequestUsername(), llRequestDisplayName() and llRequestUserKey() for SL-style identity lookup backed by live scene data and cached local user accounts."
Usage34 = "Use llGetObjectDetails(id, [OBJECT_SERVER_COST, OBJECT_STREAMING_COST, OBJECT_PHYSICS_COST, OBJECT_PRIM_EQUIVALENCE, OBJECT_RENDER_WEIGHT, OBJECT_HOVER_HEIGHT, OBJECT_SELECT_COUNT]) for SL-style object and avatar diagnostics."
Usage35 = "Use llFindNotecardTextSync() for cached synchronous notecard text search."
Usage36 = "Use llGiveAgentInventory(), TRANSFER_DEST, TRANSFER_FLAGS, TRANSFER_* result codes, llTransferOwnership(), TRANSFER_FLAG_COPY and TRANSFER_FLAG_TAKE for SL-style direct delivery and ownership workflows where estate trust and simulator support allow them."
Usage37 = "Use the bundled script-engine examples, including the EEP sky environment console, PBR GLTF physics primitive-param lab, object details diagnostics console, identity lookup console and parcel prim count auditor, to verify each newly implemented LSL feature in-world."
Usage38 = "Use llWorldPosToHUD() for HUDs that need to point at or track in-world positions."
Usage39 = "Use llGetStartString() when scripts need SL-style start parameter data after rez."
Usage40 = "llSetSculptAnim() stores the requested sculpt animation state and mirrors it through the normal texture-animation packet so viewers can see sculpt texture playback even though OpenSim has no separate sculpt-animation protocol field."
Usage41 = "Open the This estate scripts page at /regionweb/scripts for the per-function reference with signatures, return values, permissions and usage notes."
Note1 = "The default permission bitmask excludes PERMISSION_DEBIT and ownership changes."
Note2 = "Untrusted scripts keep the normal viewer permission prompt behavior."
Note3 = "The store is scoped per region/owner and persisted under KeyValueStorePath, making it useful for estate tools, games, rides and AI build workflows."
Note4 = "Use KeyValueStoreMaxKeys, KeyValueStoreMaxKeyBytes, KeyValueStoreMaxValueBytes, KeyValueStoreMaxStoreBytes and KeyValueStorePath to tune storage."
Note5 = "New constants documented by the script runtime include XP_ERROR_*, SIT_*, SIT_FLAG_*, LINKSETDATA_*, SOUND_*, REZ_*, REZ_FLAG_*, PARCEL_SALE_*, PARCEL_MEDIA_COMMAND_*, OBJECT_RETURN_*, OBJECT_* detail constants, ENV_*, SKY_*, WATER_*, TERRAIN_*, TRANSFER_*, FILTER_*, DAMAGE_TYPE_*, CHARACTER_*, PU_*, PRIM_SCRIPTED_SIT_ONLY, PRIM_ALLOW_UNSIT, PRIM_SIT_TARGET, PRIM_RENDER_MATERIAL, PRIM_GLTF_*, OVERRIDE_GLTF_* including OVERRIDE_GLTF_EXTENSION_JSON, PRIM_PHYSICS_MATERIAL and CHANGED_RENDER_MATERIAL."
Note6 = "The pathfinding backend is simulator-side A* over a region-local baked terrain cache plus dynamic object/avatar clearance bounds, not Linden Lab's proprietary baked navmesh generator. Combat2 damage adjustment is applied before health through a quiet-window transaction capped by a server-side timeout. Sculpt animation uses viewer-visible texture animation as the compatible transport. Profiler mode and counters are stored on prim dynamic attributes for local tooling/This estate web rather than a Linden viewer-only profiler capability."
Note7 = "Existing This estate feature files are merged with these built-in defaults at render time, so older auto-generated pages pick up the newer LSL surface without deleting local notes."
