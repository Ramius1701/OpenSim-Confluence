[Feature]
Title = "Automatic cloud avatar recovery"
Summary = "If an avatar becomes a cloud, the server automatically handles the recovery and restores the normal appearance within a few seconds."
Overview = "If an avatar enters the region as a cloud because appearance data or baked textures are incomplete, the server now manages the recovery path and restores the normal appearance within a few seconds. The visitor does not have to relog or manually rebake as often."
Usage1 = "Leave the recovery feature enabled on regions where visitor appearance reliability matters."
Usage2 = "When a visitor appears as a cloud, wait for the server recovery window before asking them to relog."
Usage3 = "Keep asset and inventory services healthy, because the recovery still needs the avatar's saved wearables and textures to be available."
Note1 = "The server avoids saving temporary fallback appearance as the user's real outfit."
