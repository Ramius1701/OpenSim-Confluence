[Feature]
Title = "Estate owner control room"
Summary = "Estate owners get a protected web admin panel to edit OpenSim settings, save with automatic backups, reload what is safe live and see clearly when a restart is still required."
Overview = "This estate adds a practical control room for people who run regions. Instead of opening files over remote desktop for every small change, an estate owner can request an inworld admin token, open a protected web panel, browse the allowed OpenSim configuration files, edit raw INI text or one setting at a time, save with automatic backups and ask the simulator to reload the parts that can safely change while the region is online."
Usage1 = "Open /regionweb/admin on the simulator HTTP address."
Usage2 = "Request an estate admin token while the estate owner avatar is online, then enter that token in the web form."
Usage3 = "Choose OpenSim.ini, OpenSimDefaults.ini, config-include INI files, region files, estate files or switch profile INI files from the protected configuration browser."
Usage4 = "Use the structured editor for quick one-setting changes, or the raw editor when you need to preserve comments and edit a whole section."
Usage5 = "Every save creates a timestamped backup under ConfigBackups/RegionWebAdmin before the file is changed."
Usage6 = "Press Reload what can be reloaded now after changing estate data or RegionWeb settings."
Note1 = "The admin portal only exposes an allowlist under the simulator bin folder; it does not accept arbitrary filesystem paths from the browser."
Note2 = "Estate files can request a live estate reload for loaded regions. RegionWeb settings can reload the portal's own runtime options."
Note3 = "Network, database, module startup, region identity, ports and most physics settings are still startup-bound in OpenSim. The panel saves them safely and labels them as restart-required instead of pretending they hot reload."
