[Feature]
Title = "Wave-following boats"
Summary = "Boats can now move with the sea surface, following wave motion for a more natural marina and sailing experience."
Overview = "Boat motion can now be tied to the sea surface, so vessels sit and move more naturally with waves instead of looking glued to a flat mathematical plane. This is especially visible in marinas, harbors and aerial views where water movement and boats should agree."
Usage1 = "Use boats or vehicle scripts that opt into the estate wave-following behavior."
Usage2 = "Keep the object close to the water surface so the server can apply the intended vertical motion cleanly."
Usage3 = "After updating an old boat, rerezzing it is the quickest way to ensure it starts with fresh motion state."
Note1 = "The feature improves visual motion; it does not require visitors to install a special viewer."
