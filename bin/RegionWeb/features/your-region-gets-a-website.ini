[Feature]
Title = "Your region gets a website"
Summary = "Show each region with its own shareable web page, including maps, photos, news, visitor info and live details, without building a separate website."
Overview = "This estate gives your world a real web front door. Visitors can land on one clean site, browse your regions, see big pictures, open maps, read updates and understand what makes each place special before they teleport in. Region owners can keep the page fresh by dropping snapshots into simple inworld folders instead of running a separate website."
Usage1 = "Open /regionweb/ on the simulator HTTP address to view the estate landing page."
Usage2 = "Edit bin/RegionWeb/estate.ini for the central title, tagline, hero image and feature cards."
Usage3 = "Edit bin/RegionWeb/<region-slug>/profile.ini for each region page, and add JPEG or PNG files under that region's media folder."
Usage4 = "RegionWeb auto-creates inventory folders for owner-managed carousel images: RegionWeb Carousel for the estate landing page, and RegionWeb <Region Name> Carousel for each region page. Drop inworld snapshots or textures into those folders to replace generated map tiles."
Usage5 = "Use the estate owner's RegionWeb Carousel folder for the front page carousel; use each region owner's RegionWeb <Region Name> Carousel folder for that region's hero carousel."
Usage6 = "If a carousel folder is empty, the estate page falls back to region map tiles and each single-region page falls back to one large map hero image."
Usage7 = "Create posts as text files under bin/RegionWeb/<region-slug>/posts/ using the Title, Date, Summary, Image and body format created by the sample file."
Usage8 = "Use the sticky top navigation for Regions, Features, Wallet and GitHub. Money Admin lives inside the Wallet flow and appears only to the estate owner after a valid admin token login."
Usage9 = "Use the Top button on long pages to return to the sticky navigation without scrolling back manually."
Note1 = "The module auto-creates starter folders without overwriting existing content."
Note2 = "Inventory carousel image URLs are served through /regionweb/inventory-carousel/<asset-id>.jpg only when the asset is found inside an authorized RegionWeb carousel folder."
Note3 = "Snapshots, textures and common browser image formats are accepted; JPEG2000 texture assets are decoded to JPEG for web delivery and cached for InventoryCarouselCacheSeconds."
Note4 = "InventoryCarouselLimit caps how many owner inventory images are used on a carousel, keeping the landing page responsive even if the folder contains many snapshots."
Note5 = "Existing This estate feature files merge with these built-in usage notes at render time, so older generated RegionWeb docs pick up new portal features without deleting local edits."
