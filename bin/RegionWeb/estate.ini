[EstateWeb]
Title = "My OpenSim Estate"
Tagline = "Virtual world feature showroom"
Description = "Beautiful maps, a website for every region, live weather, local money, AI help for building, boats that move like real boats, Second Life scripts that work and one-click sharing to many grids such as OSGrid, Neverworld, Craft and more."
HeroImage = ""
; Feature entries use title|description.
Feature1 = "High quality world map|Terrain textures, water depth shading, land detail, aerial tone mapping, mesh/sculpt geometry projection, cleaner water alpha handling, background generation and cooperative rendering make map tiles sharper, more geographic and safer for simulator responsiveness."
Feature2 = "Your region gets a website|Show each region with its own shareable web page, including maps, photos, news, visitor info and live details, without building a separate website."
Feature3 = "Weather module|Regions can run rain, storm, snow or sunny presets, with wind, clouds, lightning, thunder and automatic forecast cycling."
Feature4 = "Wave-following boats|Boats can now move with the sea surface, following wave motion for a more natural marina and sailing experience."
Feature5 = "Smooth region crossings|Avatar and vehicle crossings between neighbouring regions are smoothed to reduce the hard stop, rubber-banding and visual pop of stock OpenSim border transfers."
Feature6 = "Lag-resistant walk animations|Walking animations recover cleanly after lag spikes, so avatars do not remain stuck in broken walk states when the simulator catches up."
Feature7 = "AI-connected text build tools|Estate builders can use text commands connected to AI or uploaded cartography textures to plan, generate and refine terrain or building ideas directly from the simulator workflow."
Feature8 = "Automatic cloud avatar recovery|If an avatar becomes a cloud, the server automatically handles the recovery and restores the normal appearance within a few seconds."
Feature9 = "Group auto invite|Visitors can receive normal viewer group invitations on arrival without needing scripted invite objects."
Feature10 = "Viewer-visible local currency|If the separate RegionCurrency addon-module is installed, the estate can run a local persistent currency ledger that sends live balances to the viewer and handles transfers and token purchases."
Feature11 = "Estate owner control room|Estate owners get a protected web admin panel to edit OpenSim settings, save with automatic backups, reload what is safe live and see clearly when a restart is still required."
Feature12 = "Attach to many grids|Attach your region to many grids at the same time, like OSGrid, Neverworld, Craft or any public grid you choose, with one click."
Feature13 = "Viewer polish|Simulator version branding reduces noisy viewer warnings and keeps neighbouring regions feeling consistent."
Feature14 = "Second Life-style script engine|The script engine is moving closer to Second Life behavior with Experience-Lite permissions, scripted sit controls, key-value stores, linkset data, environment, estate-return, parcel media, parcel prim counts/details, guarded money transfer, inventory transfer, damage, RSA, attachment filter, identity lookup, privacy-aware agent language lookup, animation-state introspection, physics energy readback, object-detail cost readback, script memory/profiler diagnostics, GLTF material and physics primitive-param helpers, plus a This estate compatibility center and in-world regression lab."
