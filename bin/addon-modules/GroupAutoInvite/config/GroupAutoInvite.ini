; Group Auto Invite module - ported from GuntharDeNiro/opensim as a
; standalone addon-module.
;
; Automatically invites arriving avatars to a configured group after a
; short delay. Picked up automatically via the addon-modules
; Include-modules glob in OpenSimDefaults.ini.
;
; Requires the small IGroupsModule.InviteGroup(..., string message) overload
; (added as a core patch alongside this addon - see the commit message) to
; get a custom invite message; without a working Groups module configured
; at all, this addon does nothing.
;
; DELIBERATELY NO [GroupAutoInvite] SETTINGS IN THIS FILE (2026-08-19).
; They used to live here, but the addon-modules Include-modules glob
; merges this file in AFTER a region's own OpenSim.ini (Nini processes
; Include-* directives found in OpenSimDefaults.ini before it reaches
; the per-region -inifile in the source list, so files it pulls in via
; the glob end up appended - and therefore merged - later), which meant
; this file's blank GroupID silently clobbered any per-region override
; every single time, regardless of what the region's own ini said.
; Confirmed live: a region ini with a real GroupID still came up with
; GroupID unset until this file's conflicting keys were removed.
;
; Settings now live in OpenSimDefaults.ini's own [GroupAutoInvite]
; section (grid-wide default: disabled, group-less) and are meant to be
; overridden per-region in that region's own OpenSim.ini - see
; OpenSim.ini.example for the override pattern. Nothing else in the
; addon-modules Include-modules glob should redefine keys that are also
; meant to be per-region-overridable, for the same reason.
