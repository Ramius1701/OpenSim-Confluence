; OpenSimMarketplace v2.1.0
;
; Direct Delivery marketplace add-on.
;
; Install on the OpenSim process hosting ServiceRegionUUID. The process must
; have normal grid access to UserAccountService and InventoryService.

[OpenSimMarketplace]
    Enabled = true
    ; Dedicated stable region/process used only as the HTTP service host.
    ServiceRegionUUID = "11111111-2222-3333-4444-555555555555"

    ; Dedicated LOCAL account whose inventory stores immutable published
    ; Marketplace listing snapshots. Create this account normally before use.
    ServiceAccountUUID = "1289f085-b12e-4d70-b647-5df9da01a7b8"

    InventoryEndpointPath = "/opensim/marketplace/v2/inventory"
    InspectEndpointPath = "/opensim/marketplace/v2/inspect"
    SnapshotEndpointPath = "/opensim/marketplace/v2/snapshot"
    DeliveryEndpointPath = "/opensim/marketplace/v2/deliver"

    AuthType = "BasicHttpAuthentication"
    HttpAuthUsername = "opensim-marketplace"
    HttpAuthPassword = "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET"

    ; false is acceptable only for loopback/private server-to-server transport.
    RequireHttps = false
    NotifyLocalUser = true

    MaxRequestBodyBytes = 32768
    MaxInventoryNodes = 5000

    LedgerPath = "Data/OpenSimMarketplace/marketplace-deliveries-v2.jsonl"
